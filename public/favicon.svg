<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfccc8"/>
      <stop offset="1" stop-color="#a6a29e"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.28  0 0 0 0 0.26  0 0 0 0.35 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#face)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#000" filter="url(#grain)" opacity=".5"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="11" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
  <text x="32" y="43" text-anchor="middle" font-family="Archivo, Arial Black, Helvetica, sans-serif" font-weight="800" font-size="30" letter-spacing="-1.5" fill="#fff" fill-opacity=".5">AS</text>
  <text x="32" y="42" text-anchor="middle" font-family="Archivo, Arial Black, Helvetica, sans-serif" font-weight="800" font-size="30" letter-spacing="-1.5" fill="#2a2927">AS</text>
</svg>
